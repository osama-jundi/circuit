<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NHM Feeders - SLD Map</title>

  <!-- Libraries are bundled locally so the app works offline. -->
  <script src="{{ url_for('static', filename='cytoscape.min.js') }}"></script>
  <script src="{{ url_for('static', filename='dagre.min.js') }}"></script>
  <script src="{{ url_for('static', filename='cytoscape-dagre.js') }}"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f6f7f9;
      color: #222;
    }
    /* Top bar */
    header {
      background: #1e3a5f;
      color: white;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header .stats { font-size: 13px; opacity: 0.85; }

    /* Main layout: legend on left, map fills the rest */
    main {
      display: flex;
      height: calc(100vh - 50px);
    }
    aside {
      width: 200px;
      background: white;
      border-right: 1px solid #e2e5ea;
      padding: 14px;
      font-size: 13px;
      overflow-y: auto;
    }
    aside h3 {
      margin: 0 0 8px 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #667085;
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }
    .legend-swatch {
      width: 22px;
      height: 4px;
      margin-right: 8px;
      border-radius: 2px;
    }

    /* The map itself */
    #cy {
      flex: 1;
      background: white;
    }

    /* Small loading message that hides once the map is ready */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #667085;
    }
  </style>
</head>
<body>

  <header>
    <h1>NHM Feeders — Single Line Diagram</h1>
    <div class="stats">
      {{ stats.panels }} panels &middot;
      {{ stats.feeders }} feeders &middot;
      {{ stats.depth }} levels
    </div>
  </header>

  <main>
    <aside>
      <h3>Feeder Status</h3>
      <div class="legend-item">
        <span class="legend-swatch" style="background:#00B050"></span>
        Energized
      </div>
      <div class="legend-item">
        <span class="legend-swatch" style="background:#FFC000"></span>
        Issued
      </div>
      <div class="legend-item">
        <span class="legend-swatch" style="background:#A6A6A6"></span>
        Not Issued
      </div>

      <h3 style="margin-top:18px">Controls</h3>
      <div style="color:#667085; font-size:12px; line-height:1.5">
        Scroll to zoom<br>
        Drag to pan<br>
        Click a panel for details
      </div>
    </aside>

    <div id="cy">
      <div id="loading">Loading map…</div>
    </div>
  </main>

  <!-- Our JS lives in a separate file -->
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
