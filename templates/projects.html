<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects — NHM Feeders SLD</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
           background: #f4f6f9; color: #1c2b38; }
    header {
      display: flex; align-items: center; gap: 14px;
      background: linear-gradient(135deg, #1e3a5f 0%, #34567f 100%); color: #fff;
      padding: 12px 20px;
      box-shadow: 0 2px 10px rgba(15, 30, 55, 0.22);
    }
    header h1 { font-size: 18px; margin: 0; flex: 1; letter-spacing: .2px; }
    .top-btn {
      background: rgba(255,255,255,0.14); color: #fff; border: none;
      padding: 7px 13px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .top-btn:hover { background: rgba(255,255,255,0.28); }
    .user-box { display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.12); padding: 4px 6px 4px 12px; border-radius: 20px; }
    .user-box .user-name { font-size: 13px; font-weight: 600; }
    .user-box .user-role { font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
      background: rgba(255,255,255,0.22); padding: 2px 7px; border-radius: 10px; }
    .user-box .logout { color: #fff; text-decoration: none; font-size: 12px; font-weight: 600;
      padding: 4px 10px; border-radius: 14px; background: rgba(255,255,255,0.12); white-space: nowrap; }
    .user-box .logout:hover { background: rgba(255,255,255,0.3); }

    #pw-warning { background: #fef3c7; border-bottom: 1px solid #fde68a;
      padding: 8px 20px; font-size: 13px; color: #78350f; }

    main { max-width: 1100px; margin: 0 auto; padding: 26px 20px; }
    .page-head { display: flex; align-items: center; margin-bottom: 18px; }
    .page-head h2 { font-size: 20px; margin: 0; flex: 1; color: #1e3a5f; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    .card {
      background: #fff; border: 1px solid #e2e6ec; border-radius: 10px; padding: 16px;
      cursor: pointer; transition: box-shadow .15s, transform .15s; position: relative;
      display: flex; flex-direction: column; min-height: 120px;
    }
    .card:hover { box-shadow: 0 8px 24px rgba(30,58,95,.14); transform: translateY(-2px); border-color: #c3d0e0; }
    .card .name { font-size: 16px; font-weight: 700; color: #1e3a5f; margin-bottom: 6px;
      padding-right: 44px; word-break: break-word; }
    .card .meta { font-size: 12px; color: #667085; margin-top: auto; }
    .card .files { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 600;
      color: #1849a9; background: #e0ecff; padding: 2px 9px; border-radius: 10px; }
    .prog-wrap { margin: 12px 0 4px; }
    .prog { display: flex; height: 8px; border-radius: 5px; overflow: hidden; background: #e6e9ee; }
    .prog-seg { height: 100%; }
    .prog-label { font-size: 11px; color: #475467; margin-top: 5px; font-weight: 600; }
    .card .acts { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
    .card .acts span { font-size: 13px; opacity: .55; padding: 3px 5px; border-radius: 4px; }
    .card .acts span:hover { opacity: 1; background: #eef2f7; }
    .card.new { align-items: center; justify-content: center; border-style: dashed;
      color: #2a4d7a; font-weight: 600; font-size: 15px; }
    .card.new:hover { background: #f0f5fb; }
    .empty { color: #98a2b3; font-style: italic; padding: 30px 0; }

    /* Modal (Users) */
    #modal-overlay { position: fixed; inset: 0; background: rgba(15,25,40,.45);
      display: none; align-items: center; justify-content: center; z-index: 2000; }
    #modal-overlay.open { display: flex; }
    #modal { background: #fff; width: 720px; max-width: 92vw; max-height: 86vh;
      border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
      display: flex; flex-direction: column; overflow: hidden; }
    .modal-head { display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; background: #1e3a5f; color: #fff; }
    .modal-head h2 { margin: 0; font-size: 16px; }
    .modal-head button { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
    .modal-body { padding: 16px 18px; overflow-y: auto; }
    table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.tbl th, table.tbl td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #eceef2; }
    table.tbl th { color: #667085; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
    .pill { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .pill.admin { background: #e0ecff; color: #1849a9; } .pill.user { background: #eceef2; color: #475467; }
    .form-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap;
      margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #eceef2; }
    .form-row label { font-size: 11px; color: #475467; display: block; margin-bottom: 3px; }
    .form-row input, .form-row select { padding: 7px 9px; font-size: 13px; border: 1px solid #d0d5dd; border-radius: 6px; }
    .mini-btn { padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
      border: none; border-radius: 6px; background: #1e3a5f; color: #fff; }
    .mini-btn:hover { background: #2a4d7a; }
    .mini-btn.danger { background: #d92d20; } .mini-btn.danger:hover { background: #b42318; }
    .mini-btn.ghost { background: #eceef2; color: #344054; } .mini-btn.ghost:hover { background: #dde1e7; }

    #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #1c2b38; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px;
      opacity: 0; pointer-events: none; transition: .25s; z-index: 3000; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { background: #b42318; }
  </style>
</head>
<body data-role="{{ user.role if user else '' }}" data-username="{{ user.username if user else '' }}"
      data-csrf="{{ csrf }}" data-can-manage="{{ 'yes' if user and user.role == 'admin' else 'no' }}">

<header>
  <h1>NHM Feeders — Projects</h1>
  {% if user and user.role == 'admin' %}
  <button id="users-btn" class="top-btn" title="Manage users">👥 Users</button>
  {% endif %}
  {% if user %}
  <div class="user-box" title="Account settings">
    <span class="user-name" id="account-link" style="cursor:pointer">{{ user.username }}</span>
    <span class="user-role">{{ user.role }}</span>
    <a href="{{ url_for('logout') }}" class="logout">⎋ Logout</a>
  </div>
  {% endif %}
</header>

{% if default_admin_warning %}
<div id="pw-warning">⚠ You're using the default admin password. Open <strong>👥 Users</strong> and change it.</div>
{% endif %}

<main>
  <div class="page-head"><h2>Projects</h2></div>
  <div id="grid" class="grid"><div class="empty">Loading…</div></div>
</main>

<div id="modal-overlay">
  <div id="modal">
    <div class="modal-head"><h2 id="modal-title">Manage users</h2><button id="modal-close">×</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="toast"></div>
<script src="{{ url_for('static', filename='dialogs.js') }}"></script>
<script src="{{ url_for('static', filename='projects.js') }}"></script>
</body>
</html>
