# Render Blueprint. In the Render dashboard: New + > Blueprint, point it at
# this repo, and it creates the web service and a managed PostgreSQL database
# below. DATABASE_URL is injected automatically, so your users, edits and
# history live in Postgres (no persistent disk needed).
databases:
  - name: circuit-db
    plan: free          # free Postgres; bump to a paid plan for production

services:
  - type: web
    name: circuit-sld
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: the in-memory graph is the live source of truth and is kept
    # consistent with the DB within a single process.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: circuit-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true   # Render generates a strong random value
      - key: SECURE_COOKIES
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
      - key: ADMIN_USERNAME
        sync: false            # set these yourself in the dashboard
      - key: ADMIN_PASSWORD
        sync: false
